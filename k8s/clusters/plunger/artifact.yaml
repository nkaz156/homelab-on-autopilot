---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: flux-system
  namespace: flux-system
spec:
  sources:
    - alias: monorepo
      kind: GitRepository
      name: flux-system
  # pathPattern: "@monorepo/k8s/apps/{group}/{namespace}/{app}/{env}"
  artifacts:
    - name: system
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/k8s/apps/system/**"
          to: "@artifact/"
          exclude: "**/prod/**"

    - name: apps
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/apps/base/**"
          to: "@artifact/base/"
        - from: "@monorepo/apps/production/**"
          to: "@artifact/production/"
